<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Transcriber</title>
<style>
:root{--bg:#faf9f6;--card:#fff;--text:#1f1d1a;--muted:#77726a;--line:#e4e0d8;--accent:#c4552d;--s0:#2d6cc4;--s1:#2d9a63;--s2:#b8862a;--s3:#8c4bb8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--card:#252320;--text:#f0ede6;--muted:#9b958a;--line:#38352f;--accent:#e87a54;--s0:#6ea3ec;--s1:#5fc48c;--s2:#e0b25a;--s3:#c08fe6}}
:root[data-theme="dark"]{--bg:#1a1917;--card:#252320;--text:#f0ede6;--muted:#9b958a;--line:#38352f;--accent:#e87a54;--s0:#6ea3ec;--s1:#5fc48c;--s2:#e0b25a;--s3:#c08fe6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;padding:16px;max-width:680px;margin:0 auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.speakers{display:flex;flex-wrap:wrap;gap:8px}
.sp{display:flex;align-items:center;border:2px solid var(--c);border-radius:999px;overflow:hidden;background:transparent}
.sp.active{background:var(--c)}
.sp button{border:0;background:none;color:inherit;font:inherit;padding:8px 6px 8px 14px;cursor:pointer}
.sp input{border:0;background:none;color:var(--text);font:inherit;font-weight:600;width:90px;padding:8px 14px 8px 14px;outline:none}
.sp.active input{color:#fff}
.sp .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-left:12px}
.sp.active .dot{background:#fff}
.add{border:2px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.row{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line);flex:0 0 auto;padding:14px 18px}
.btn.rec{background:#c43030}
#log{min-height:180px}
.entry{margin-bottom:12px}
.who{font-weight:700;font-size:13px}
.txt{margin:2px 0 0}
.live{color:var(--muted);font-style:italic}
.empty{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>Live Transcriber</h1>
<p class="sub">Tap a name to say who is speaking. Text is labeled as you switch.</p>

<div class="card">
  <div class="label">Who's speaking</div>
  <div class="speakers" id="speakers"></div>
</div>

<div class="row" style="margin-bottom:12px">
  <button class="btn" id="toggle">Start listening</button>
  <button class="btn sec" id="copy">Copy</button>
  <button class="btn sec" id="clear">Clear</button>
</div>

<div class="card" id="log"><span class="empty">Transcript will appear here.</span></div>
<div class="note" id="note">Works best in Chrome, Edge or Safari. Your browser will ask for microphone access. Audio is processed by your browser's speech service.</div>

<script>
const COLORS=['var(--s0)','var(--s1)','var(--s2)','var(--s3)'];
let speakers=[{name:'Speaker 1'},{name:'Speaker 2'}];
let current=0, entries=[], interim='', listening=false, rec=null;

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function renderSpeakers(){
  const el=$('speakers'); el.innerHTML='';
  speakers.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sp'+(i===current?' active':'');
    d.style.setProperty('--c',COLORS[i%4]);
    d.innerHTML='<span class="dot"></span>';
    const inp=document.createElement('input');
    inp.value=s.name; inp.setAttribute('aria-label','Speaker name');
    inp.oninput=()=>{s.name=inp.value||('Speaker '+(i+1));renderLog()};
    inp.onclick=()=>{ if(i!==current){current=i;renderSpeakers()} };
    d.onclick=e=>{ if(e.target.tagName!=='INPUT'){current=i;renderSpeakers()} };
    d.appendChild(inp); el.appendChild(d);
  });
  if(speakers.length<4){
    const a=document.createElement('button');
    a.className='add'; a.textContent='+ Add';
    a.onclick=()=>{speakers.push({name:'Speaker '+(speakers.length+1)});current=speakers.length-1;renderSpeakers()};
    el.appendChild(a);
  }
}

function renderLog(){
  const log=$('log');
  if(!entries.length&&!interim){log.innerHTML='<span class="empty">Transcript will appear here.</span>';return}
  let h=entries.map(e=>`<div class="entry"><div class="who" style="color:${COLORS[e.sp%4]}">${esc(speakers[e.sp]?.name||'Speaker')}</div><p class="txt">${esc(e.text)}</p></div>`).join('');
  if(interim) h+=`<div class="entry"><div class="who" style="color:${COLORS[current%4]}">${esc(speakers[current].name)}</div><p class="txt live">${esc(interim)}</p></div>`;
  log.innerHTML=h;
  window.scrollTo({top:document.body.scrollHeight});
}

function addFinal(text){
  text=text.trim(); if(!text) return;
  const last=entries[entries.length-1];
  if(last&&last.sp===current) last.text+=' '+text;
  else entries.push({sp:current,text});
}

function start(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('note').textContent='Speech recognition isn\'t supported in this browser. Try Chrome, Edge or Safari.';return}
  rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang=navigator.language||'en-US';
  rec.onresult=ev=>{
    let tmp='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i];
      if(r.isFinal) addFinal(r[0].transcript); else tmp+=r[0].transcript;
    }
    interim=tmp; renderLog();
  };
  rec.onerror=ev=>{
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){
      $('note').textContent='Microphone access was blocked. Allow it in your browser settings and try again.';
      stop();
    }
  };
  rec.onend=()=>{ if(listening){ try{rec.start()}catch(e){} } };
  listening=true;
  try{rec.start()}catch(e){}
  setBtn();
}
function stop(){
  listening=false;
  if(interim){addFinal(interim);interim=''}
  try{rec&&rec.stop()}catch(e){}
  setBtn(); renderLog();
}
function setBtn(){
  const b=$('toggle');
  b.textContent=listening?'Stop listening':'Start listening';
  b.classList.toggle('rec',listening);
}

$('toggle').onclick=()=>listening?stop():start();
$('clear').onclick=()=>{entries=[];interim='';renderLog()};
$('copy').onclick=async()=>{
  const t=entries.map(e=>`${speakers[e.sp]?.name||'Speaker'}: ${e.text}`).join('\n\n');
  if(!t) return;
  const b=$('copy');
  try{await navigator.clipboard.writeText(t);b.textContent='Copied';}
  catch(e){b.textContent='Copy failed'}
  setTimeout(()=>b.textContent='Copy',1500);
};

renderSpeakers(); renderLog();
</script>
</body>
</html>
